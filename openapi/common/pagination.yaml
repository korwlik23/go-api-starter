components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Requested page size. The API enforces the upper bound.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, per_page, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
