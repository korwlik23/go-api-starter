components:
  parameters:
    ContentAfterID:
      in: query
      name: after_id
      schema:
        format: uuid
        type: string
    ContentAfterUpdatedAt:
      in: query
      name: after_updated_at
      schema:
        format: date-time
        type: string
    ContentLimit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    ContentLocale:
      in: query
      name: locale
      required: true
      schema:
        maxLength: 255
        minLength: 2
        type: string
    Page:
      description: One-based page number.
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
    PerPage:
      description: Requested page size. The API enforces the upper bound.
      in: query
      name: per_page
      required: false
      schema:
        default: 25
        maximum: 100
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The request could not be processed.
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The request conflicts with current state or a concurrent change.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The authenticated principal lacks the required permission.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The requested resource is not available.
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The request exceeded its rate limit.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Authentication is required or no longer valid.
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The request content type is not supported.
  schemas:
    AEOFields:
      additionalProperties: false
      properties:
        answer:
          maxLength: 20000
          type: string
        question:
          maxLength: 255
          type: string
      required:
        - question
        - answer
      type: object
    AccountRoleAssignmentRequest:
      additionalProperties: false
      properties:
        account_id:
          minLength: 1
          type: string
        expected_version:
          minimum: 1
          type: integer
        scope:
          enum:
            - account
          type: string
        user_id:
          minLength: 1
          type: string
      required:
        - scope
        - account_id
        - user_id
        - expected_version
      type: object
    AdminUserDetailResponse:
      additionalProperties: false
      properties:
        memberships:
          items:
            $ref: '#/components/schemas/AdminUserMembershipSummary'
          type: array
        user:
          $ref: '#/components/schemas/AdminUserResponse'
      required:
        - user
        - memberships
      type: object
    AdminUserListItem:
      allOf:
        - $ref: '#/components/schemas/AdminUserResponse'
        - properties:
            active_membership_count:
              minimum: 0
              type: integer
            membership_count:
              minimum: 0
              type: integer
          required:
            - membership_count
            - active_membership_count
          type: object
    AdminUserListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminUserListItem'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      type: object
    AdminUserMembershipSummary:
      additionalProperties: false
      properties:
        account_id:
          minLength: 1
          type: string
        account_slug:
          minLength: 1
          type: string
        authorization_version:
          minimum: 1
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          minLength: 1
          type: string
        status:
          enum:
            - active
            - disabled
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - account_id
        - account_slug
        - status
        - authorization_version
        - created_at
        - updated_at
      type: object
    AdminUserResponse:
      additionalProperties: false
      properties:
        authorization_version:
          minimum: 1
          type: integer
        created_at:
          format: date-time
          type: string
        email:
          format: email
          type: string
        id:
          minLength: 1
          type: string
        status:
          enum:
            - active
            - disabled
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - email
        - status
        - authorization_version
        - created_at
        - updated_at
      type: object
    AdminUserStatusRequest:
      additionalProperties: false
      properties:
        expected_version:
          minimum: 1
          type: integer
        status:
          enum:
            - active
            - disabled
          type: string
      required:
        - status
        - expected_version
      type: object
    Asset:
      additionalProperties: false
      properties:
        account_id:
          format: uuid
          type: string
        byte_size:
          format: int64
          maximum: 52428800
          minimum: 0
          type: integer
        created_at:
          format: date-time
