openapi: 3.0.3
info:
  description: Versioned HTTP contract for the go-lang-starter suite.
  title: go-api-starter API
  version: 0.1.0
servers:
  - url: '{scheme}://{host}/api/v1'
    variables:
      host:
        default: api.tewarach-dev.me
      scheme:
        default: https
        enum:
          - https
          - http
paths:
  /accounts/current:
    get:
      operationId: getCurrentAccount
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountResponse'
          description: The resolved account projection.
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - SessionCookie: []
      summary: Read the account resolved for the authenticated principal.
      tags:
        - Accounts
  /accounts/{account_id}/memberships:
    get:
      operationId: listAccountMemberships
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            minLength: 1
            type: string
        - in: query
          name: status
          required: false
          schema:
            enum:
              - active
              - disabled
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
          description: A bounded membership page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - SessionCookie: []
      summary: List memberships for a specific account.
      tags:
        - Accounts
      x-required-permission: accounts.memberships.read.system
  /accounts/{account_id}/memberships/{membership_id}/status:
    patch:
      operationId: updateMembershipStatus
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            minLength: 1
            type: string
        - in: path
          name: membership_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
          description: The membership status changed and affected sessions were invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Change membership status with optimistic concurrency.
      tags:
        - Accounts
      x-required-permission: accounts.memberships.manage.system
  /audit/events:
    get:
      operationId: listAuditEvents
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            maxLength: 512
            minLength: 1
            type: string
        - in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 200
            minimum: 1
            type: integer
        - in: query
          name: action
          required: false
          schema:
            maxLength: 128
            minLength: 1
            type: string
        - in: query
          name: actor_id
          required: false
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
          description: A redacted append-only audit page.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - SessionCookie: []
      summary: List redacted system audit events.
      tags:
        - Audit
      x-required-permission: audit.events.read.system
  /auth/csrf:
    get:
      operationId: getCSRFToken
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
          description: A short-lived pre-auth session and its session-bound CSRF token.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
            Set-Cookie:
              description: Opaque pre-auth session cookie; attributes are environment-configured.
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      summary: Create or rotate an anonymous pre-auth session and issue a CSRF token.
      tags:
        - Identity
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAuthenticatedResponse'
          description: Authentication completed and the session was rotated.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
            Set-Cookie:
              description: Rotated opaque authenticated session cookie with secure attributes.
              schema:
                type: string
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginMFAPendingResponse'
          description: Password authentication completed but MFA verification is pending.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
            Set-Cookie:
              description: Rotated opaque MFA-pending session cookie with secure attributes.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Authenticate with a pre-auth session and rotate its session state.
      tags:
        - Identity
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: The current session was revoked.
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
            Set-Cookie:
              description: Expired opaque session cookie with the same secure scope.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Revoke the current session and expire its cookie.
      tags:
        - Identity
  /auth/mfa/challenge:
    get:
      operationId: getMFAChallenge
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAChallengeResponse'
          description: The pending-only MFA challenge without secret or verification-code material.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - SessionCookie: []
      summary: Read the safe projection of the current MFA-pending challenge.
      tags:
        - Identity
  /auth/mfa/enrollment:
    post:
      operationId: enrollMFA
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollmentResponse'
          description: Pending enrollment with a one-time provisioning URI.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Create a pending MFA enrollment for the authenticated session.
      tags:
        - Identity
  /auth/mfa/enrollment/{enrollment_id}/confirmation:
    post:
      operationId: confirmMFAEnrollment
      parameters:
        - in: path
          name: enrollment_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAEnrollmentConfirmationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollmentConfirmationResponse'
          description: Enrollment confirmed; recovery codes are returned only once.
          headers:
            Cache-Control:
              description: Recovery codes must never be cached.
              schema:
                enum:
                  - no-store
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Confirm a pending MFA enrollment and issue one-time recovery codes.
      tags:
        - Identity
  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerificationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAVerificationResponse'
          description: MFA succeeded and the pending session was rotated to authenticated.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
            Set-Cookie:
              description: Rotated opaque authenticated session cookie with secure attributes.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Verify a pending MFA challenge and rotate to an authenticated session.
      tags:
        - Identity
  /auth/password/recovery:
    post:
      operationId: requestPasswordRecovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryAcceptedResponse'
          description: The request was accepted regardless of account existence or status.
          headers:
            Cache-Control:
              description: Recovery state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Request password recovery without revealing whether the account exists.
      tags:
        - Identity
  /auth/password/reset:
    post:
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: The password was reset, existing sessions revoked, and pre-auth state rotated.
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
            Referrer-Policy:
              schema:
                enum:
                  - no-referrer
                type: string
            Set-Cookie:
              description: Rotated opaque pre-auth session cookie with secure attributes.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Consume a one-time recovery token, reset the password, and rotate session state.
      tags:
        - Identity
  /auth/session:
    get:
      operationId: getCurrentSession
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
          description: Current authenticated session without raw token or fingerprint material.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                enum:
                  - no-store
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - SessionCookie: []
      summary: Read the authenticated principal and current session projection.
      tags:
        - Identity
  /auth/sessions:
    get:
      operationId: listSessions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
          description: Sessions without raw token or device fingerprint values.
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - SessionCookie: []
      summary: List safe device and session metadata for the authenticated principal.
      tags:
        - Identity
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeSession
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocationResult'
          description: The target session was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Revoke another active session owned by the authenticated principal.
      tags:
        - Identity
  /authorization/assignments/{assignment_id}:
    delete:
      operationId: revokeRoleAssignment
      parameters:
        - in: path
          name: assignment_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRevokeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRevokeResponse'
          description: The assignment was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Revoke a role assignment while preserving the last-manager invariant.
      tags:
        - Authorization
  /authorization/effective-permissions:
    get:
      operationId: getEffectivePermissions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissionsResponse'
          description: Effective permissions after account and session-state resolution.
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - SessionCookie: []
      summary: Read active permission keys for the resolved account and principal.
      tags:
        - Authorization
  /authorization/roles:
    get:
      operationId: listAuthorizationRoles
      parameters:
        - in: query
          name: scope
          required: false
          schema:
            enum:
              - system
              - account
            type: string
        - in: query
          name: account_id
          required: false
          schema:
            minLength: 1
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
          description: A bounded role page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - SessionCookie: []
      summary: List roles visible to the system administration surface.
      tags:
        - Authorization
    post:
      operationId: createAuthorizationRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
          description: The account role was created.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Create an account-owned role.
      tags:
        - Authorization
  /authorization/roles/{role_id}:
    patch:
      operationId: updateAuthorizationRole
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
          description: The account role was renamed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Rename an account-owned role with optimistic concurrency.
      tags:
        - Authorization
  /authorization/roles/{role_id}/assignments:
    get:
      operationId: listRoleAssignments
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            minLength: 1
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentListResponse'
          description: A bounded assignment page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - SessionCookie: []
      summary: List principals assigned to a role.
      tags:
        - Authorization
    post:
      operationId: assignRole
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'
          description: The role assignment was applied.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Assign a role in account or system scope using optimistic concurrency.
      tags:
        - Authorization
  /authorization/roles/{role_id}/permissions:
    get:
      operationId: listRolePermissions
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionListResponse'
          description: The role permission projection.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - SessionCookie: []
      summary: List permissions granted to a role.
      tags:
        - Authorization
    post:
      operationId: grantRolePermission
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrantRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGrantResponse'
          description: The permission grant was applied.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Grant a permission key to a role using optimistic concurrency.
      tags:
        - Authorization
  /discoverability/audits:
    get:
      operationId: listDiscoverabilityAudits
      parameters:
        - in: query
          name: content_id
          schema:
            format: uuid
            type: string
        - in: query
          name: translation_id
          schema:
            format: uuid
            type: string
        - in: query
          name: locale_id
          schema:
            format: uuid
            type: string
        - in: query
          name: status
          schema:
            enum:
              - pass
              - warning
              - error
            type: string
        - in: query
          name: limit
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: after_updated_at
          schema:
            format: date-time
            type: string
        - in: query
          name: after_id
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAuditListResponse'
          description: Account-scoped audit results ordered by update time and ID.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - SessionCookie: []
      summary: List stored deterministic GEO/AEO content audit results.
      tags:
        - Discoverability
      x-required-permission: discoverability.audit.read.own
    post:
      operationId: runDiscoverabilityAudit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunContentAuditRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAudit'
          description: The audit result was stored with the observed content and translation versions.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BadRequest'
      security:
        - CSRFToken: []
          SessionCookie: []
      summary: Run and store a deterministic audit for one content translation.
      tags:
        - Discoverability
      x-required-permission: discoverability.audit.run.own
  /discoverability/audits/{audit_id}:
    get:
      operationId: getDiscoverabilityAudit
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAudit'
          description: The stored audit result.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - SessionCookie: []
      summary: Read one stored deterministic content audit result.
      tags:
        - Discoverability
      x-required-permission: discoverability.audit.read.own
    parameters:
      - in: path
        name: audit_id
        required: true
        schema:
          format: uuid
          type: string
  /discoverability/redirects:
    get:
      operationId: listDiscoverabilityRedirects
      parameters:
        - in: query
          name: locale_id
          schema:
            format: uuid
            type: string
        - in: query
          name: enabled
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
