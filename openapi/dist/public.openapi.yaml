openapi: 3.0.3
info:
  description: Versioned HTTP contract for the go-lang-starter suite.
  title: go-api-starter API
  version: 0.1.0
servers:
  - url: '{scheme}://{host}/api/v1'
    variables:
      host:
        default: api.tewarach-dev.me
      scheme:
        default: https
        enum:
          - https
          - http
paths:
  /locales:
    get:
      operationId: listLocales
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleListResponse'
          description: Locale registry ordered by canonical locale code.
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      summary: List locales visible to public and administrative consumers.
      tags:
        - Localization
  /localization/catalog:
    get:
      operationId: getTranslationCatalog
      parameters:
        - in: query
          name: locale
          required: true
          schema:
            minLength: 2
            type: string
        - in: query
          name: category
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationCatalogResponse'
          description: Merged translation entries and their catalog version.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      summary: Read a versioned translation category for an enabled locale.
      tags:
        - Localization
  /public/content/{locale}/{path}:
    get:
      operationId: getPublicContent
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            minLength: 2
            type: string
        - description: Normalized public content path without the locale prefix.
          in: path
          name: path
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
          description: The published content translation and its published alternate locales.
          headers:
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      summary: Resolve one published content translation for the public site.
      tags:
        - Publishing
  /public/menus/{locale}/{location}:
    get:
      operationId: getPublicMenu
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            minLength: 2
            type: string
        - in: path
          name: location
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenu'
          description: Enabled menu with enabled items only.
          headers:
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      summary: Resolve one enabled public navigation menu for a locale.
      tags:
        - Navigation
  /public/posts/{locale}:
    get:
      operationId: listPublicPosts
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            minLength: 2
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostListResponse'
          description: Published posts ordered by the public content cursor.
          headers:
            Cache-Control:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      summary: List published posts for one public locale.
      tags:
        - Publishing
  /public/posts/{locale}/{slug}:
    get:
      operationId: getPublicPost
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            minLength: 2
            type: string
        - in: path
          name: slug
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
          description: The published post.
          headers:
            Cache-Control:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      summary: Resolve one published post by locale and slug.
      tags:
        - Publishing
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The request could not be processed.
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: An unexpected error prevented completion of the request.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The requested resource is not available.
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The request exceeded its rate limit.
  schemas:
    ErrorEnvelope:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Problem'
      required:
        - error
      type: object
    FieldErrors:
      additionalProperties:
        items:
          type: string
        type: array
      type: object
    Locale:
      additionalProperties: false
      properties:
        code:
          minLength: 2
          type: string
        default:
          type: boolean
        direction:
          enum:
            - ltr
            - rtl
          type: string
        enabled:
          type: boolean
        id:
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
        selectable:
          type: boolean
        version:
          minimum: 1
          type: integer
      required:
        - id
        - code
        - name
        - direction
        - enabled
        - selectable
        - default
      type: object
    LocaleListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Locale'
          type: array
      required:
        - items
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable, machine-readable error code.
          type: string
        fields:
          $ref: '#/components/schemas/FieldErrors'
        message:
          description: Safe, translatable message for the caller.
          type: string
        request_id:
          description: Opaque correlation identifier; never an authorization credential.
          minLength: 1
          type: string
      required:
        - code
        - message
        - fields
        - request_id
      type: object
    PublicAEO:
      additionalProperties: false
      properties:
        answer:
          type: string
        question:
          type: string
      type: object
    PublicAlternate:
      additionalProperties: false
      properties:
        locale_id:
          format: uuid
          type: string
        path:
          minLength: 1
          type: string
        slug:
          minLength: 1
          type: string
        title:
          minLength: 1
          type: string
        translation_id:
          format: uuid
          type: string
      required:
        - translation_id
        - locale_id
        - slug
        - path
        - title
      type: object
    PublicBlock:
      additionalProperties: false
      properties:
        data:
          additionalProperties: true
          type: object
        type:
          enum:
            - text
            - image
            - callout
            - answer
            - steps
            - comparison
          type: string
      required:
        - type
        - data
      type: object
    PublicContent:
      additionalProperties: false
      properties:
        aeo:
          $ref: '#/components/schemas/PublicAEO'
        alternates:
          items:
            $ref: '#/components/schemas/PublicAlternate'
          type: array
        blocks:
          items:
            $ref: '#/components/schemas/PublicBlock'
          minItems: 1
          type: array
        content_id:
          format: uuid
          type: string
        content_key:
          minLength: 1
          type: string
        content_status:
          enum:
            - published
          type: string
        content_version:
          minimum: 1
          type: integer
        excerpt:
          type: string
        geo:
          $ref: '#/components/schemas/PublicGEO'
        kind:
          enum:
            - page
            - post
          type: string
        locale_id:
          format: uuid
          type: string
        path:
          minLength: 1
          type: string
        published_at:
          format: date-time
          type: string
        seo:
          $ref: '#/components/schemas/PublicSEO'
        slug:
          minLength: 1
          type: string
        title:
          minLength: 1
          type: string
        translation_id:
          format: uuid
          type: string
        translation_status:
          enum:
            - published
          type: string
        translation_version:
          minimum: 1
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - content_id
        - translation_id
        - locale_id
        - kind
        - content_key
        - content_status
        - content_version
        - translation_status
        - translation_version
        - slug
        - path
        - title
        - excerpt
        - blocks
        - seo
        - geo
        - aeo
        - updated_at
        - alternates
      type: object
    PublicGEO:
      additionalProperties: false
      properties:
        locality:
          type: string
        region:
          type: string
      type: object
    PublicMenu:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        items:
          items:
            $ref: '#/components/schemas/PublicMenuItem'
          type: array
        key:
          minLength: 1
          type: string
        locale_id:
          format: uuid
          type: string
        name:
          minLength: 1
          type: string
        version:
          minimum: 1
          type: integer
      required:
        - id
        - locale_id
        - key
        - name
        - version
        - items
      type: object
    PublicMenuItem:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: '#/components/schemas/PublicMenuItem'
          type: array
        id:
          format: uuid
          type: string
        label:
          minLength: 1
          type: string
        parent_id:
          format: uuid
          type: string
        position:
          minimum: 0
          type: integer
        target:
          minLength: 1
          type: string
        target_kind:
          enum:
            - internal_path
            - external_url
            - content_key
          type: string
      required:
        - id
        - label
        - target_kind
        - target
        - position
      type: object
    PublicPostCursor:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - updated_at
        - id
      type: object
    PublicPostItem:
      additionalProperties: false
      properties:
        content_id:
          format: uuid
          type: string
        locale_id:
          format: uuid
          type: string
        path:
          minLength: 1
          type: string
        slug:
          minLength: 1
          type: string
        title:
          minLength: 1
          type: string
        translation_id:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - content_id
        - translation_id
        - locale_id
        - slug
        - path
        - title
        - updated_at
      type: object
    PublicPostListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/PublicPostItem'
          type: array
        next:
          $ref: '#/components/schemas/PublicPostCursor'
      required:
        - items
      type: object
    PublicSEO:
      additionalProperties: false
      properties:
        canonical_url:
          format: uri-reference
          type: string
        description:
          type: string
        robots:
          type: string
        structured_data:
          additionalProperties: true
          type: object
        title:
          type: string
      required:
        - title
        - description
      type: object
    TranslationCatalogResponse:
      additionalProperties: false
      properties:
        category:
          minLength: 1
          type: string
        entries:
          additionalProperties:
            type: string
          type: object
        locale:
          minLength: 2
          type: string
        version:
          minimum: 1
          type: integer
      required:
        - locale
        - category
        - version
        - entries
      type: object
