openapi: 3.0.3
info:
  title: go-api-starter API
  version: 0.1.0
  description: Versioned HTTP contract for the go-lang-starter suite.
servers:
  - url: "{scheme}://{host}/api/v1"
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.tewarach-dev.me
paths:
  /auth/csrf:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1csrf
  /auth/login:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1login
  /auth/mfa/enrollment:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1mfa~1enrollment
  /auth/mfa/enrollment/{enrollment_id}/confirmation:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1mfa~1enrollment~1{enrollment_id}~1confirmation
  /auth/mfa/challenge:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1mfa~1challenge
  /auth/mfa/verify:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1mfa~1verify
  /auth/session:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1session
  /auth/sessions:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1sessions
  /auth/sessions/{session_id}:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1sessions~1{session_id}
  /auth/logout:
    $ref: ./modules/identity/auth.yaml#/paths/~1auth~1logout
  /auth/password/recovery:
    $ref: ./modules/identity/recovery.yaml#/paths/~1auth~1password~1recovery
  /auth/password/reset:
    $ref: ./modules/identity/recovery.yaml#/paths/~1auth~1password~1reset
  /accounts/current:
    $ref: ./modules/accounts/accounts.yaml#/paths/~1accounts~1current
  /accounts/{account_id}/memberships:
    $ref: ./modules/accounts/memberships.yaml#/paths/~1accounts~1{account_id}~1memberships
  /accounts/{account_id}/memberships/{membership_id}/status:
    $ref: ./modules/accounts/memberships.yaml#/paths/~1accounts~1{account_id}~1memberships~1{membership_id}~1status
  /users:
    $ref: ./modules/identity/admin-users.yaml#/paths/~1users
  /users/{user_id}:
    $ref: ./modules/identity/admin-users.yaml#/paths/~1users~1{user_id}
  /users/{user_id}/status:
    $ref: ./modules/identity/admin-users.yaml#/paths/~1users~1{user_id}~1status
  /authorization/effective-permissions:
    $ref: ./modules/authorization/permissions.yaml#/paths/~1authorization~1effective-permissions
  /authorization/roles:
    $ref: ./modules/authorization/permissions.yaml#/paths/~1authorization~1roles
  /authorization/roles/{role_id}:
    $ref: ./modules/authorization/permissions.yaml#/paths/~1authorization~1roles~1{role_id}
  /authorization/roles/{role_id}/permissions:
    $ref: ./modules/authorization/permissions.yaml#/paths/~1authorization~1roles~1{role_id}~1permissions
  /authorization/roles/{role_id}/assignments:
    $ref: ./modules/authorization/permissions.yaml#/paths/~1authorization~1roles~1{role_id}~1assignments
  /authorization/assignments/{assignment_id}:
    $ref: ./modules/authorization/permissions.yaml#/paths/~1authorization~1assignments~1{assignment_id}
  /locales:
    $ref: ./modules/localization/locales.yaml#/paths/~1locales
  /locales/{locale_id}:
    $ref: ./modules/localization/locales.yaml#/paths/~1locales~1{locale_id}
  /locales/{locale_id}/status:
    $ref: ./modules/localization/locales.yaml#/paths/~1locales~1{locale_id}~1status
  /locales/{locale_id}/default:
    $ref: ./modules/localization/locales.yaml#/paths/~1locales~1{locale_id}~1default
  /locales/preferences:
    $ref: ./modules/localization/preferences.yaml#/paths/~1locales~1preferences
  /localization/catalog:
    $ref: ./modules/localization/catalog.yaml#/paths/~1localization~1catalog
  /operations/modules:
    $ref: ./modules/operations/modules.yaml#/paths/~1operations~1modules
  /livez:
    $ref: ./modules/system/health.yaml#/paths/~1livez
  /readyz:
    $ref: ./modules/system/health.yaml#/paths/~1readyz
components:
  schemas:
    Problem:
      $ref: ./common/errors.yaml#/components/schemas/Problem
    ErrorEnvelope:
      $ref: ./common/errors.yaml#/components/schemas/ErrorEnvelope
    PageInfo:
      $ref: ./common/pagination.yaml#/components/schemas/PageInfo
  parameters:
    Page:
      $ref: ./common/pagination.yaml#/components/parameters/Page
    PerPage:
      $ref: ./common/pagination.yaml#/components/parameters/PerPage
  responses:
    BadRequest:
      $ref: ./common/errors.yaml#/components/responses/BadRequest
    Unauthorized:
      $ref: ./common/errors.yaml#/components/responses/Unauthorized
    Forbidden:
      $ref: ./common/errors.yaml#/components/responses/Forbidden
    NotFound:
      $ref: ./common/errors.yaml#/components/responses/NotFound
    Conflict:
      $ref: ./common/errors.yaml#/components/responses/Conflict
    TooManyRequests:
      $ref: ./common/errors.yaml#/components/responses/TooManyRequests
    InternalServerError:
      $ref: ./common/errors.yaml#/components/responses/InternalServerError
  securitySchemes:
    SessionCookie:
      $ref: ./common/security.yaml#/components/securitySchemes/SessionCookie
    CSRFToken:
      $ref: ./common/security.yaml#/components/securitySchemes/CSRFToken
