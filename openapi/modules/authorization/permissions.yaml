paths:
  /authorization/roles:
    get:
      tags: [Authorization]
      summary: List roles visible to the system administration surface.
      operationId: listAuthorizationRoles
      x-surfaces: [admin]
      security:
        - SessionCookie: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [system, account]
        - name: account_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: ../../common/pagination.yaml#/components/parameters/Page
        - $ref: ../../common/pagination.yaml#/components/parameters/PerPage
      responses:
        '200':
          description: A bounded role page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
    post:
      tags: [Authorization]
      summary: Create an account-owned role.
      operationId: createAuthorizationRole
      x-surfaces: [admin]
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: The account role was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../common/errors.yaml#/components/responses/Conflict
  /authorization/roles/{role_id}:
    patch:
      tags: [Authorization]
      summary: Rename an account-owned role with optimistic concurrency.
      operationId: updateAuthorizationRole
      x-surfaces: [admin]
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: The account role was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../../common/errors.yaml#/components/responses/Conflict
  /authorization/effective-permissions:
    get:
      tags: [Authorization]
      summary: Read active permission keys for the resolved account and principal.
      operationId: getEffectivePermissions
      x-surfaces: [admin]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Effective permissions after account and session-state resolution.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissionsResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
  /authorization/roles/{role_id}/permissions:
    get:
      tags: [Authorization]
      summary: List permissions granted to a role.
      operationId: listRolePermissions
      x-surfaces: [admin]
      security:
        - SessionCookie: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The role permission projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionListResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/errors.yaml#/components/responses/NotFound
    post:
      tags: [Authorization]
      summary: Grant a permission key to a role using optimistic concurrency.
      operationId: grantRolePermission
      x-surfaces: [admin]
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrantRequest'
      responses:
        '200':
          description: The permission grant was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionGrantResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../common/errors.yaml#/components/responses/Conflict
  /authorization/roles/{role_id}/assignments:
    get:
      tags: [Authorization]
      summary: List principals assigned to a role.
      operationId: listRoleAssignments
      x-surfaces: [admin]
      security:
        - SessionCookie: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: ../../common/pagination.yaml#/components/parameters/Page
        - $ref: ../../common/pagination.yaml#/components/parameters/PerPage
      responses:
        '200':
          description: A bounded assignment page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentListResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/errors.yaml#/components/responses/NotFound
    post:
      tags: [Authorization]
      summary: Assign a role in account or system scope using optimistic concurrency.
      operationId: assignRole
      x-surfaces: [admin]
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: The role assignment was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../common/errors.yaml#/components/responses/Conflict
  /authorization/assignments/{assignment_id}:
    delete:
      tags: [Authorization]
      summary: Revoke a role assignment while preserving the last-manager invariant.
      operationId: revokeRoleAssignment
      x-surfaces: [admin]
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRevokeRequest'
      responses:
        '200':
          description: The assignment was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRevokeResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../common/errors.yaml#/components/responses/Conflict
components:
  schemas:
    RoleResponse:
      type: object
      additionalProperties: false
      required: [id, owner_type, name, version, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        owner_type:
          type: string
          enum: [system, account]
        account_id:
          type: string
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoleListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        page:
          $ref: ../../common/pagination.yaml#/components/schemas/PageInfo
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [scope, account_id, name]
      properties:
        scope:
          type: string
          enum: [account]
        account_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [name, expected_version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expected_version:
          type: integer
          minimum: 1
    RolePermissionItem:
      type: object
      additionalProperties: false
      required: [permission_key, active, delegable, tier]
      properties:
        permission_key:
          type: string
          minLength: 1
        active:
          type: boolean
        delegable:
          type: boolean
        tier:
          type: string
          enum: [core, default, optional]
    RolePermissionListResponse:
      type: object
      additionalProperties: false
      required: [role_id, role_version, items]
      properties:
        role_id:
          type: string
          minLength: 1
        role_version:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/RolePermissionItem'
    RoleAssignmentItem:
      type: object
      additionalProperties: false
      required: [assignment_id, role_id, scope, user_id, created_at]
      properties:
        assignment_id:
          type: string
          minLength: 1
        role_id:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [system, account]
        account_id:
          type: string
          nullable: true
        user_id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    RoleAssignmentListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentItem'
        page:
          $ref: ../../common/pagination.yaml#/components/schemas/PageInfo
    EffectivePermissionsResponse:
      type: object
      additionalProperties: false
      required: [account_id, permissions]
      properties:
        account_id:
          type: string
          minLength: 1
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    PermissionGrantRequest:
      type: object
      additionalProperties: false
      required: [permission_key, expected_version]
      properties:
        permission_key:
          type: string
          minLength: 1
        expected_version:
          type: integer
          minimum: 1
    PermissionGrantResponse:
      type: object
      additionalProperties: false
      required: [role_id, permission_key, version, affected_principals, session_outcome]
      properties:
        role_id:
          type: string
          minLength: 1
        permission_key:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        affected_principals:
          type: integer
          minimum: 0
        session_outcome:
          $ref: '#/components/schemas/SessionInvalidationOutcome'
    RoleAssignmentRequest:
      oneOf:
        - $ref: '#/components/schemas/AccountRoleAssignmentRequest'
        - $ref: '#/components/schemas/SystemRoleAssignmentRequest'
      discriminator:
        propertyName: scope
        mapping:
          account: '#/components/schemas/AccountRoleAssignmentRequest'
          system: '#/components/schemas/SystemRoleAssignmentRequest'
    AccountRoleAssignmentRequest:
      type: object
      additionalProperties: false
      required: [scope, account_id, user_id, expected_version]
      properties:
        scope:
          type: string
          enum: [account]
        account_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        expected_version:
          type: integer
          minimum: 1
    SystemRoleAssignmentRequest:
      type: object
      additionalProperties: false
      required: [scope, user_id, expected_version]
      properties:
        scope:
          type: string
          enum: [system]
        user_id:
          type: string
          minLength: 1
        expected_version:
          type: integer
          minimum: 1
    RoleAssignmentResponse:
      type: object
      additionalProperties: false
      required: [assignment_id, role_id, version, affected_principals, session_outcome]
      properties:
        assignment_id:
          type: string
          minLength: 1
        role_id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        affected_principals:
          type: integer
          minimum: 0
        session_outcome:
          $ref: '#/components/schemas/SessionInvalidationOutcome'
    RoleRevokeRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
    RoleRevokeResponse:
      type: object
      additionalProperties: false
      required: [assignment_id, revoked, version, affected_principals, session_outcome]
      properties:
        assignment_id:
          type: string
          minLength: 1
        revoked:
          type: boolean
          enum: [true]
        version:
          type: integer
          minimum: 1
        affected_principals:
          type: integer
          minimum: 0
        session_outcome:
          $ref: '#/components/schemas/SessionInvalidationOutcome'
    SessionInvalidationOutcome:
      type: object
      additionalProperties: false
      required: [current_principal, other_principals]
      properties:
        current_principal:
          type: string
          enum: [unchanged, rotated]
        other_principals:
          type: string
          enum: [unchanged, invalidated]
