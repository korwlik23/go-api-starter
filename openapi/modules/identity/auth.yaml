paths:
  /auth/csrf:
    get:
      tags: [Identity]
      summary: Create or rotate an anonymous pre-auth session and issue a CSRF token.
      operationId: getCSRFToken
      security: []
      responses:
        '200':
          description: A short-lived pre-auth session and its session-bound CSRF token.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: Opaque pre-auth session cookie; attributes are environment-configured.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
        '429':
          $ref: ../../common/errors.yaml#/components/responses/TooManyRequests
  /auth/login:
    post:
      tags: [Identity]
      summary: Authenticate with a pre-auth session and rotate its session state.
      operationId: login
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication completed and the session was rotated.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: Rotated opaque authenticated session cookie with secure attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAuthenticatedResponse'
        '202':
          description: Password authentication completed but MFA verification is pending.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: Rotated opaque MFA-pending session cookie with secure attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginMFAPendingResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../../common/errors.yaml#/components/responses/TooManyRequests
  /auth/mfa/enrollment:
    post:
      tags: [Identity]
      summary: Create a pending MFA enrollment for the authenticated session.
      operationId: enrollMFA
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        '201':
          description: Pending enrollment with a one-time provisioning URI.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollmentResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../../common/errors.yaml#/components/responses/TooManyRequests
  /auth/mfa/challenge:
    get:
      tags: [Identity]
      summary: Read the safe projection of the current MFA-pending challenge.
      operationId: getMFAChallenge
      security:
        - SessionCookie: []
      responses:
        '200':
          description: The pending-only MFA challenge without secret or verification-code material.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAChallengeResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
  /auth/mfa/verify:
    post:
      tags: [Identity]
      summary: Verify a pending MFA challenge and rotate to an authenticated session.
      operationId: verifyMFA
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerificationRequest'
      responses:
        '200':
          description: MFA succeeded and the pending session was rotated to authenticated.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: Rotated opaque authenticated session cookie with secure attributes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAVerificationResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/errors.yaml#/components/responses/Forbidden
        '429':
          $ref: ../../common/errors.yaml#/components/responses/TooManyRequests
  /auth/session:
    get:
      tags: [Identity]
      summary: Read the authenticated principal and current session projection.
      operationId: getCurrentSession
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current authenticated session without raw token or fingerprint material.
          headers:
            Cache-Control:
              description: Authentication state must never be stored by shared caches.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
  /auth/sessions:
    get:
      tags: [Identity]
      summary: List safe device and session metadata for the authenticated principal.
      operationId: listSessions
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Sessions without raw token or device fingerprint values.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: ../../common/errors.yaml#/components/responses/Unauthorized
components:
  schemas:
    CSRFTokenResponse:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 1
          description: Session-bound CSRF token for the immediately following unsafe request.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true
    LoginAuthenticatedResponse:
      type: object
      additionalProperties: false
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [authenticated]
        csrf_token:
          type: string
          minLength: 1
    LoginMFAPendingResponse:
      type: object
      additionalProperties: false
      required: [status, csrf_token, challenge_id]
      properties:
        status:
          type: string
          enum: [mfa_pending]
        csrf_token:
          type: string
          minLength: 1
        challenge_id:
          type: string
          minLength: 1
          description: Opaque identifier for the pending MFA challenge.
    MFAEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollment_id, provisioning_uri]
      properties:
        enrollment_id:
          type: string
          minLength: 1
          description: Opaque identifier used only to confirm this enrollment.
        provisioning_uri:
          type: string
          format: uri
          minLength: 1
          description: One-time URI for the authenticator application; server storage encrypts its TOTP secret.
    MFAChallengeResponse:
      type: object
      additionalProperties: false
      required: [status, challenge_id, methods]
      properties:
        status:
          type: string
          enum: [mfa_pending]
        challenge_id:
          type: string
          minLength: 1
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [totp, recovery_code]
    MFAVerificationRequest:
      type: object
      additionalProperties: false
      required: [method, code]
      properties:
        method:
          type: string
          enum: [totp, recovery_code]
        code:
          type: string
          minLength: 1
          writeOnly: true
    MFAVerificationResponse:
      type: object
      additionalProperties: false
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [authenticated]
        csrf_token:
          type: string
          minLength: 1
    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, principal, state]
      properties:
        session_id:
          type: string
          minLength: 1
        state:
          type: string
          enum: [authenticated]
        principal:
          type: object
          additionalProperties: false
          required: [id, email]
          properties:
            id:
              type: string
              minLength: 1
            email:
              type: string
              format: email
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, created_at, last_seen_at, current]
            properties:
              id:
                type: string
                minLength: 1
              created_at:
                type: string
                format: date-time
              last_seen_at:
                type: string
                format: date-time
              current:
                type: boolean
