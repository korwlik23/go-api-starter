paths:
  /accounts/{account_id}/memberships:
    get:
      tags: [Accounts]
      summary: List memberships for a specific account.
      operationId: listAccountMemberships
      x-surfaces: [admin]
      x-required-permission: accounts.memberships.read.system
      security:
        - SessionCookie: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, disabled] }
        - $ref: ../../common/pagination.yaml#/components/parameters/Page
        - $ref: ../../common/pagination.yaml#/components/parameters/PerPage
      responses:
        '200':
          description: A bounded membership page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipListResponse' }
        '401': { $ref: ../../common/errors.yaml#/components/responses/Unauthorized }
        '403': { $ref: ../../common/errors.yaml#/components/responses/Forbidden }
  /accounts/{account_id}/memberships/{membership_id}/status:
    patch:
      tags: [Accounts]
      summary: Change membership status with optimistic concurrency.
      operationId: updateMembershipStatus
      x-surfaces: [admin]
      x-required-permission: accounts.memberships.manage.system
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipStatusRequest' }
      responses:
        '200':
          description: The membership status changed and affected sessions were invalidated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '401': { $ref: ../../common/errors.yaml#/components/responses/Unauthorized }
        '403': { $ref: ../../common/errors.yaml#/components/responses/Forbidden }
        '404': { $ref: ../../common/errors.yaml#/components/responses/NotFound }
        '409': { $ref: ../../common/errors.yaml#/components/responses/Conflict }
components:
  schemas:
    MembershipResponse:
      type: object
      additionalProperties: false
      required: [id, account_id, account_slug, user_id, user_email, status, authorization_version, created_at, updated_at]
      properties:
        id: { type: string, minLength: 1 }
        account_id: { type: string, minLength: 1 }
        account_slug: { type: string, minLength: 1 }
        user_id: { type: string, minLength: 1 }
        user_email: { type: string, format: email }
        status: { type: string, enum: [active, disabled] }
        authorization_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MembershipListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MembershipResponse' }
        page: { $ref: ../../common/pagination.yaml#/components/schemas/PageInfo }
    MembershipStatusRequest:
      type: object
      additionalProperties: false
      required: [status, expected_version]
      properties:
        status: { type: string, enum: [active, disabled] }
        expected_version: { type: integer, minimum: 1 }
