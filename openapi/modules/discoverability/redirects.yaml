paths:
  /discoverability/redirects:
    get:
      tags: [Discoverability]
      summary: List account-scoped redirect rules in stable cursor order.
      operationId: listDiscoverabilityRedirects
      x-surfaces: [admin]
      x-required-permission: discoverability.redirects.read.own
      security:
        - SessionCookie: []
      parameters:
        - name: locale_id
          in: query
          schema: {type: string, format: uuid}
        - name: enabled
          in: query
          schema: {type: boolean}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: after_updated_at
          in: query
          schema: {type: string, format: date-time}
        - name: after_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Account-scoped redirect rules.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RedirectListResponse'}
        '400': {$ref: ../../common/errors.yaml#/components/responses/BadRequest}
        '401': {$ref: ../../common/errors.yaml#/components/responses/Unauthorized}
        '403': {$ref: ../../common/errors.yaml#/components/responses/Forbidden}
    post:
      tags: [Discoverability]
      summary: Create an account-scoped redirect rule.
      operationId: createDiscoverabilityRedirect
      x-surfaces: [admin]
      x-required-permission: discoverability.redirects.write.own
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedirectMutationRequest'}
      responses:
        '201':
          description: The redirect rule was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Redirect'}
        '400': {$ref: ../../common/errors.yaml#/components/responses/BadRequest}
        '401': {$ref: ../../common/errors.yaml#/components/responses/Unauthorized}
        '403': {$ref: ../../common/errors.yaml#/components/responses/Forbidden}
        '409': {$ref: ../../common/errors.yaml#/components/responses/Conflict}
        '422': {$ref: ../../common/errors.yaml#/components/responses/BadRequest}
  /discoverability/redirects/{redirect_id}:
    parameters:
      - name: redirect_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Discoverability]
      summary: Read one account-scoped redirect rule.
      operationId: getDiscoverabilityRedirect
      x-surfaces: [admin]
      x-required-permission: discoverability.redirects.read.own
      security:
        - SessionCookie: []
      responses:
        '200':
          description: The redirect rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Redirect'}
        '401': {$ref: ../../common/errors.yaml#/components/responses/Unauthorized}
        '403': {$ref: ../../common/errors.yaml#/components/responses/Forbidden}
        '404': {$ref: ../../common/errors.yaml#/components/responses/NotFound}
    patch:
      tags: [Discoverability]
      summary: Replace a redirect rule using optimistic concurrency.
      operationId: updateDiscoverabilityRedirect
      x-surfaces: [admin]
      x-required-permission: discoverability.redirects.write.own
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedirectUpdateRequest'}
      responses:
        '200':
          description: The updated redirect rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Redirect'}
        '400': {$ref: ../../common/errors.yaml#/components/responses/BadRequest}
        '401': {$ref: ../../common/errors.yaml#/components/responses/Unauthorized}
        '403': {$ref: ../../common/errors.yaml#/components/responses/Forbidden}
        '404': {$ref: ../../common/errors.yaml#/components/responses/NotFound}
        '409': {$ref: ../../common/errors.yaml#/components/responses/Conflict}
        '422': {$ref: ../../common/errors.yaml#/components/responses/BadRequest}
    delete:
      tags: [Discoverability]
      summary: Soft-delete a redirect rule using optimistic concurrency.
      operationId: deleteDiscoverabilityRedirect
      x-surfaces: [admin]
      x-required-permission: discoverability.redirects.write.own
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
      responses:
        '204': {description: The redirect rule was soft-deleted.}
        '400': {$ref: ../../common/errors.yaml#/components/responses/BadRequest}
        '401': {$ref: ../../common/errors.yaml#/components/responses/Unauthorized}
        '403': {$ref: ../../common/errors.yaml#/components/responses/Forbidden}
        '404': {$ref: ../../common/errors.yaml#/components/responses/NotFound}
        '409': {$ref: ../../common/errors.yaml#/components/responses/Conflict}
components:
  schemas:
    Redirect:
      type: object
      additionalProperties: false
      required: [id, account_id, locale_id, source_path, destination_path, status_code, enabled, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        locale_id: {type: string, format: uuid}
        source_path: {type: string, minLength: 1, maxLength: 512, pattern: '^/[a-z0-9][a-z0-9/_-]*$|^/$'}
        destination_path: {type: string, minLength: 1, maxLength: 512, pattern: '^/[a-z0-9][a-z0-9/_-]*$|^/$'}
        status_code: {type: integer, enum: [301, 302, 307, 308]}
        enabled: {type: boolean}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RedirectCursor:
      type: object
      additionalProperties: false
      required: [updated_at, id]
      properties:
        updated_at: {type: string, format: date-time}
        id: {type: string, format: uuid}
    RedirectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Redirect'}
        next:
          $ref: '#/components/schemas/RedirectCursor'
    RedirectMutationRequest:
      type: object
      additionalProperties: false
      required: [locale_id, source_path, destination_path, status_code, enabled]
      properties:
        locale_id: {type: string, format: uuid}
        source_path: {type: string, minLength: 1, maxLength: 512}
        destination_path: {type: string, minLength: 1, maxLength: 512}
        status_code: {type: integer, enum: [301, 302, 307, 308]}
        enabled: {type: boolean}
    RedirectUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RedirectMutationRequest'
        - type: object
          required: [expected_version]
          properties:
            expected_version: {type: integer, minimum: 1}
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
