name: API code

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: false

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: "0"

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      - name: Build commands
        run: go build ./cmd/api ./cmd/migrate ./cmd/bootstrap ./cmd/healthcheck
        env:
          CGO_ENABLED: "0"
