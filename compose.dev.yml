# Disposable integration databases only. These services intentionally publish
# no host ports and must never be pointed at application or production data.
services:
  postgres:
    profiles:
      - postgres
    image: docker.io/library/postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    environment:
      POSTGRES_DB: go_lang_starter_test_postgres
      POSTGRES_USER: go_lang_starter_test
      POSTGRES_PASSWORD: development-only-test-database-password
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --host=127.0.0.1
        - --username=go_lang_starter_test
        - --dbname=go_lang_starter_test_postgres
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - postgres_test_data:/var/lib/postgresql
    networks:
      - database_test

  mariadb:
    profiles:
      - mariadb
    image: docker.io/library/mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
    restart: "no"
    environment:
      MARIADB_DATABASE: go_lang_starter_test_mariadb
      MARIADB_USER: go_lang_starter_test
      MARIADB_PASSWORD: development-only-test-database-password
      MARIADB_ROOT_PASSWORD: development-only-test-root-password
    expose:
      - "3306"
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - mariadb_test_data:/var/lib/mysql
    networks:
      - database_test

  go-test:
    profiles:
      - go-test
    image: docker.io/library/golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
    init: true
    read_only: true
    working_dir: /workspace
    entrypoint:
      - go
    command:
      - version
    environment:
      GOCACHE: /root/.cache/go-build
      GOTMPDIR: /root/.cache/go-build
      GOTOOLCHAIN: local
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - .:/workspace:ro
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    networks:
      - database_test
      - test_egress

networks:
  database_test:
    internal: true
  test_egress:

volumes:
  go_build_cache:
  go_module_cache:
  mariadb_test_data:
  postgres_test_data:
