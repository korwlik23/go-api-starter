title = "go-api-starter Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore the literal TOTP environment key in its typed config mapping."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*\{?key:\s*"TOTP_ENCRYPTION_KEY_B64",\s*value:\s*cfg\.Session\.TOTPEncryptionKey\},?\s*$''',
  '''^\s*key:\s*"TOTP_ENCRYPTION_KEY_B64",\s*$''',
]
paths = [
  '''internal/platform/config/(security|validate_test)\.go$''',
]

[[allowlists]]
description = "Allow canonical UUID literals used as non-secret database fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]
paths = [
  '''internal/modules/identity/adapters/gorm/.*_test\.go$''',
]
