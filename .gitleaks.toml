title = "go-api-starter Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Ignore the literal TOTP environment key name; it is not a secret value."
regexTarget = "line"
regexes = [
  '''TOTP_ENCRYPTION_KEYS?_B64''',
]

[[allowlists]]
description = "Allow canonical UUID literals used as non-secret database fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]
paths = [
  '''internal/modules/identity/adapters/gorm/.*_test\.go$''',
]
